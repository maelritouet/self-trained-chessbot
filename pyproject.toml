[project]
name = "chessgpt"
version = "0.1.0"
description = "A small character-level GPT trained from scratch on Lichess games."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy",
    "python-chess",
    "zstandard",
    "requests",
    "pyyaml",
    "tqdm",
    "matplotlib",
]

[dependency-groups]
dev = [
    "huggingface-hub>=2.4.0",
    "kaggle>=2.2.5",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "onnxscript>=0.7.2",
    "playwright>=1.64.1",
    "pytest",
    "six>=1.17.0",  # kaggle 2.2.5 imports six without declaring it
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chessgpt", "eval"]

# Local machine has no CUDA: pull the CPU-only torch wheel (~200 MB instead of ~2 GB).
# Only uv reads this; on Kaggle `pip install -e .` keeps the preinstalled CUDA torch.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
